name: Build Husk IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Husk's native dependencies and packaging scripts require macOS + Xcode.
    runs-on: macos-14
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        run: |
          brew install meson ninja pkg-config python@3.12 xcodegen qemu cmake             autoconf automake libtool gettext glib pixman bison coreutils

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rppairing-ios/target
          key: ${{ runner.os }}-rust-ios-${{ hashFiles('src/rppairing-ios/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-ios-

      - name: Cache fetched source archives
        uses: actions/cache@v4
        with:
          path: |
            third_party/sources
          key: ${{ runner.os }}-husk-source-archives-v1

      - name: Build Husk and package IPA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/build/Husk.ipa"

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail
          test -s build/Husk.ipa
          test -s build/Husk.tipa
          /usr/bin/unzip -t build/Husk.ipa
          /usr/bin/unzip -t build/Husk.tipa
          /usr/bin/unzip -Z1 build/Husk.ipa | grep -q '^Payload/Husk.app/Info.plist$'
          /usr/bin/unzip -Z1 build/Husk.tipa | grep -q '^Payload/Husk.app/Info.plist$'
          echo "IPA: $(du -h build/Husk.ipa | awk '{print $1}')"
          echo "TIPA: $(du -h build/Husk.tipa | awk '{print $1}')"

      - name: Upload IPA and TrollStore package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa-${{ github.sha }}
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-build-logs-${{ github.sha }}
          path: |
            build/logs/
            /tmp/husk_ipa/build.log
          if-no-files-found: warn
          retention-days: 7
